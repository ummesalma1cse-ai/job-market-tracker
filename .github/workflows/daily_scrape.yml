name: Daily Job Scrape

on:
  schedule:
    # Runs every day at 00:17 UTC (06:17 AM Bangladesh time)
    - cron: "17 0 * * *"
  # Lets you run it manually from the GitHub "Actions" tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run scraper
        run: python scraper/scrape_jobs.py

      - name: Commit updated master data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/jobs_master.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily data update $(date -u +%Y-%m-%d)"
            git push
          fi
